# Alembic configuration for the PhotoFlow backend.
#
# Run from the backend/ directory:
#
#     alembic upgrade head
#     alembic downgrade -1
#     alembic revision --autogenerate -m "add foo"
#
# Note there is deliberately NO sqlalchemy.url here. The connection string is a
# secret and is read from PHOTOFLOW_DATABASE_URL by migrations/env.py, which
# also refuses to touch a production database without an explicit confirmation.
# A URL in this file would be committed to a repository with a public remote.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

# Timestamped, ordered revision filenames: 2026_08_10_1432-ab12cd_add_foo.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
# Keep generated migrations consistent with the repo's ruff configuration.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
