<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="SA Innovations">
  <title>SA Innovations</title>
  <!-- Favicon variant of sa-mark.svg: the same "A", but sat on the site's
       near black so the tile keeps a defined edge against a white browser tab
       strip, and inset very slightly so the gradient is not clipped by the
       browser's own rounding. -->
  <defs>
    <linearGradient id="sa-fav-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a7dff"/>
      <stop offset="0.55" stop-color="#7a6bff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="11" fill="#0f1012"/>
  <rect x="3" y="3" width="42" height="42" rx="9.5" fill="url(#sa-fav-grad)"/>

  <g fill="#ffffff">
    <path d="M24 11 L37.6 37 L31.1 37 L24 23.2 L16.9 37 L10.4 37 Z"/>
    <rect x="15" y="28.4" width="18" height="5.2"/>
  </g>
</svg>
