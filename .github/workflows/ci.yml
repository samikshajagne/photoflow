# Continuous integration — free for public repositories.
#
# Catches regressions here rather than after a multi-minute Windows build, or
# worse, on a customer's machine.
#
# Note the deliberate choice of requirements file: the test and preflight jobs
# install requirements.txt / requirements-dev.txt and NOT requirements-extra.txt,
# because a release build excludes the extras (insightface, rembg, onnxruntime,
# openai) too. If a test ever starts depending on an extra, CI fails here — which
# is exactly where we want to find out.

name: CI

on:
  push:
    branches: ["**"]          # every branch, not just main — catch it early
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # Qt renders without a display; the Qt suites self-skip if PyQt6 is absent.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for Qt/OpenCV
        # PyQt6 6.5+ also needs the xcb platform plugin libraries; without
        # libxcb-cursor0 the offscreen import can still fail with a bare
        # "libxcb-cursor.so.0: cannot open shared object file".
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  preflight:
    name: Packaging preflight
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for Qt/OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install runtime dependencies only
        # Mirrors a release build environment, so the "packages that must not be
        # in a release build" check is meaningful.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight
        # Validates bundled data files, hidden imports, version consistency and
        # writable-path discipline. Runs on Linux even though the real build must
        # happen on Windows, because these checks are platform-independent.
        run: python packaging/preflight.py

  website:
    name: Website checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links, assets and page structure
        working-directory: website
        run: python check_site.py

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose: the codebase predates ruff being enforced, so a style
    # backlog must not be able to block a release. Tighten this to a hard failure
    # once `ruff check .` is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
